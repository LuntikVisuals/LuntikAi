name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          accept-android-sdk-licenses: true

      - name: Licenses
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          mkdir -p $ANDROID_HOME/licenses
          echo -e "24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > $ANDROID_HOME/licenses/android-sdk-license

      - uses: gradle/actions/setup-gradle@v4

      - name: Wrapper
        run: |
          gradle wrapper --gradle-version 8.9 || true
          chmod +x gradlew || true

      - name: Build
        run: |
          if [ -f ./gradlew ]; then ./gradlew assembleDebug --stacktrace --no-daemon
          else gradle assembleDebug --stacktrace --no-daemon; fi

      - name: Prepare APK
        if: success()
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/*.apk release/LuntikAi.apk
          ls -la release/

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: luntikai-debug-apk
          path: release/LuntikAi.apk
          retention-days: 14

      - uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: latest
          name: LuntikAi latest
          body: Автосборка для LuntikStore
          files: release/LuntikAi.apk
          draft: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
